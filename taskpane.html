<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Client Email</title>
  <link rel="stylesheet" href="taskpane.css" />
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="text/javascript" src="msal-browser.min.js"></script>
  <script type="text/javascript" src="taskpane.js"></script>
</head>
<body>
  <!-- Pick clients -->
  <section id="pickView" hidden>
    <h1>Choose client</h1>

    <p id="loadStatus" class="status" role="status"></p>
    <button id="signInBtn" class="primary" hidden>Sign in to load clients</button>

    <div id="pickControls" hidden>
      <label for="clientFilter">Search name or email</label>
      <input id="clientFilter" type="text" placeholder="Type to filter…" autocomplete="off" />

      <div id="clientList" class="client-list" role="group" aria-label="Clients"></div>

      <div id="selectedBox" class="selected" hidden>
        <strong>Selected:</strong> <span id="selectedNames"></span>
        <a href="#" id="clearSel" class="small-link">Clear</a>
      </div>
      <div id="sharedHints"></div>

      <label for="topicInput">Topic</label>
      <input id="topicInput" type="text" placeholder="e.g. Weekly Update" />
      <p class="hint">Subject becomes: <strong id="subjectPreview">…</strong></p>

      <button id="applyBtn" class="primary" disabled>Apply</button>
      <p id="pickStatus" class="status" role="status"></p>
    </div>

    <p class="footer">
      <a href="#" id="refreshLink">Reload clients</a> ·
      <a href="#" id="openSettings">Topic &amp; template</a>
    </p>
  </section>

  <!-- Settings -->
  <section id="settingsView" hidden>
    <h1>Topic &amp; template</h1>
    <p class="hint">Saved in this mailbox only. Clients come from the “Tax Clients” contacts folder.</p>

    <label for="defaultTopic">Default topic</label>
    <input id="defaultTopic" type="text" placeholder="e.g. Weekly Update" />

    <label for="bodyText">Email body template (optional)</label>
    <textarea id="bodyText" rows="8" placeholder="Dear [Client],&#10;&#10;Please find attached…"></textarea>
    <p class="hint">Type <strong>[Client]</strong> where the client name(s) should appear.</p>

    <button id="saveBtn" class="primary">Save</button>
    <button id="cancelBtn">Back</button>
    <p id="settingsStatus" class="status" role="status"></p>
  </section>
</body>
</html>
